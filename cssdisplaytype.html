<!DOCTYPE html>
<html lang="en">
<head>
    <title>Flexbox Example</title>
    <style>
        body{
            font-family: Arial;
            background-color: white;
        }
        .container{
            display:flex;
            flex-direction: row;
            flex-wrap: wrap;
            flex-flow: row wrap;

            justify-content: space-between;
            align-items: center;
            align-content: space-around;

            gap:20px;
            row-gap: 20px;
            column-gap: 30px;

            background-color: #263445;
            padding: 20px;
            height: 250px;
        }
        .card{
            padding: 30px;
            text-align: center;
            color: white;
            font-weight: bold;
            border-radius: 8px;

            flex: 1 1 100px;
            flex-grow: 1;
            flex-shrink: 1;
            flex-basis: 100px;
        }
        .card:nth-child(1){
            background-color:#2563eb;
        }
        .card:nth-child(2){
            background-color: #059669;
            order: 2;
            align-self: flex-end;
        }
        .card:nth-child(3){
            background-color: #d97706;
            order: 1;
        }
    </style>
</head>
<body>
    <h2>Courses</h2>

    <div class="container">
        <div class="card">CSE</div>
        <div class="card">ECE</div>
        <div class="card">IT</div>
    </div>
</body>
</html>
